[font]
size = 11.0

[font.normal]
family = "DejaVu Sans Mono"
style = "Book"

[font.bold]
family = "DejaVu Sans Mono"
style = "Bold"

[font.italic]
family = "DejaVu Sans Mono"
style = "Oblique"

[window]
padding = { x = 4, y = 4 }
opacity = 0.85

[scrolling]
history = 10000

[env]
TERM = "xterm-256color"
